description: 'Azarus was a consumer startup that built an interactive engagement and rewards layer for
  live game streaming and esports, letting viewers take part in real-time interactive experiences and
  earn blockchain-based crypto rewards while watching streams on platforms like Twitch. Backed by Kleiner
  Perkins, Azarus was acquired by Coinbase in April 2021 to build interactive experiences into its
  consumer products. The former azarus.io domain now 302-redirects to a YouTube video and exposes no
  public API, developer portal, documentation, packages, or other machine-readable surface; this profile
  is retained in the API Evangelist network as a portfolio lead with no live API to enrich.'
